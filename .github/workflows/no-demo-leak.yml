name: no-demo-leak
on:
  push:
  pull_request:
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Demo material must not be in the repository
        run: python3 tools/check_no_demo_leak.py
